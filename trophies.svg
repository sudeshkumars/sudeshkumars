<svg xmlns="http://www.w3.org/2000/svg" width="760" height="186" viewBox="0 0 760 186" role="img" aria-labelledby="t"><title id="t">Sudesh's GitHub milestones</title><defs><linearGradient id="bg"><stop stop-color="#191027"/><stop offset="1" stop-color="#2b1240"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffd782"/><stop offset="1" stop-color="#ff70c4"/></linearGradient><style>@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes shine{to{transform:translateX(800px)}}.cell{opacity:0;animation:pop .5s ease forwards;transform-box:fill-box;transform-origin:center}</style></defs><rect x="2" y="2" width="756" height="182" rx="22" fill="url(#bg)" stroke="#da83ff66"/><text x="24" y="34" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Milestones &amp; Momentum</text><g font-family="Arial" text-anchor="middle"><g class="cell" style="animation-delay:.15s"><rect x="22" y="51" width="170" height="108" rx="15" fill="#ffffff09" stroke="#ffd78250"/><text x="107" y="93" font-size="29" fill="url(#gold)">✦</text><text x="107" y="119" font-size="12" fill="#fff">18 PUBLIC STARS</text><text x="107" y="140" font-size="10" fill="#b9a7c9">community signal</text></g><g class="cell" style="animation-delay:.3s"><rect x="207" y="51" width="170" height="108" rx="15" fill="#ffffff09" stroke="#cc83ff50"/><text x="292" y="93" font-size="29" fill="#ce9cff">⌘</text><text x="292" y="119" font-size="12" fill="#fff">25 REPOSITORIES</text><text x="292" y="140" font-size="10" fill="#b9a7c9">ideas in motion</text></g><g class="cell" style="animation-delay:.45s"><rect x="392" y="51" width="170" height="108" rx="15" fill="#ffffff09" stroke="#ff75c750"/><text x="477" y="93" font-size="29" fill="#ff8dd0">♥</text><text x="477" y="119" font-size="12" fill="#fff">8 FOLLOWERS</text><text x="477" y="140" font-size="10" fill="#b9a7c9">growing together</text></g><g class="cell" style="animation-delay:.6s"><rect x="577" y="51" width="160" height="108" rx="15" fill="#ffffff09" stroke="#7be3ce50"/><text x="657" y="93" font-size="29" fill="#8fe9d1">◎</text><text x="657" y="119" font-size="12" fill="#fff">ALWAYS BUILDING</text><text x="657" y="140" font-size="10" fill="#b9a7c9">MERN • Lua • FiveM</text></g></g><rect x="-100" y="0" width="75" height="190" fill="url(#gold)" opacity=".15" style="animation:shine 4s 1.4s infinite"/></svg>

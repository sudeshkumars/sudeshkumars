name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Build local contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_contributions.py
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sudeshkumars
          outputs: |
            dist/snake.svg?color_snake=%2343e6f3&color_dots=%23d9fbff%2C%23a8f3ff%2C%2364dcf7%2C%2335b7ec%2C%23177bd4
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
